<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <ul id="tableList" class="table-list"></ul>
      <p id="emptyTables" class="muted">No tables yet</p>
      <button id="openCreateTable" class="btn btn-orange create-new">+ Create new table</button>
    </aside>

    <main class="content">
      <div class="content-header">
        <h2 id="currentTableName"></h2>
        <div class="header-actions">
          <button id="openInsertRecord" class="btn btn-green" hidden>Insert record</button>
          <button id="deleteTableBtn" class="btn btn-link danger" hidden>Delete table</button>
        </div>
      </div>
      <p id="placeholder" class="muted">Select a table on the left, or create a new one.</p>
      <div class="table-wrap">
        <table id="recordsTable" class="records" hidden>
          <thead><tr id="recordsHead"></tr></thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Create table modal -->
  <div id="createTableModal" class="overlay" hidden>
    <form id="createTableForm" class="modal modal-light">
      <button type="button" class="close" data-close aria-label="Close">X</button>
      <h3>Create Table</h3>
      <label for="tableName" class="label">Table name</label>
      <input id="tableName" type="text" required autocomplete="off">

      <div class="field-grid">
        <span class="label">Field names</span>
        <span class="label">Type</span>
      </div>
      <div id="fieldRows"></div>
      <a href="#" id="addFieldBtn" class="add-field">Add another field</a>

      <p id="createTableError" class="error" hidden></p>
      <button type="submit" class="btn btn-orange">Create Table</button>
    </form>
  </div>

  <!-- Add record modal -->
  <div id="addRecordModal" class="overlay" hidden>
    <form id="addRecordForm" class="modal modal-slate">
      <button type="button" class="close" data-close aria-label="Close">X</button>
      <h3>Add record</h3>
      <div id="recordInputs"></div>
      <p id="addRecordError" class="error" hidden></p>
      <button type="submit" class="btn btn-plain">Add record</button>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
